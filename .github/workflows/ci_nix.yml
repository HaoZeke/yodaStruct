name: Nix flake

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci_nix.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'meson.build'
      - 'src/**'
      - 'lua/**'
      - 'example_lua/**'
      - 'input/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci_nix.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'meson.build'
      - 'src/**'
      - 'lua/**'
      - 'example_lua/**'
      - 'input/**'

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate, build, and test flake checks
        run: nix flake check --print-build-logs
