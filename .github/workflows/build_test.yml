name: Build yodaStruct and test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build_test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: yoda
          create-args: >-
            cxx-compiler
            meson
            ninja
            pkg-config
            eigen
            libblas
            liblapack
            lua=5.4
            cmake
          cache-environment: true
      - name: Configure and build
        shell: bash -el {0}
        run: |
          meson setup bbdir --prefix=/usr --libdir=lib --wrap-mode=nofallback
          meson compile -C bbdir
      - name: Tests
        shell: bash -el {0}
        run: meson test -C bbdir -v --print-errorlogs
      - name: Test staged install
        shell: bash -el {0}
        run: |
          DESTDIR="$PWD/stage" meson install -C bbdir
          export LUA_PATH="$PWD/stage/usr/share/luadseams/lua/?.lua;;"
          export LUA_CPATH="$PWD/stage/usr/lib/?.so;;"
          export DSEAMS_INSTALL_ROOT="$PWD/stage"
          lua example_lua/library/installed.lua
